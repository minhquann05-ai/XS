<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Archive Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .result {
      font-family: monospace;
      white-space: pre;
      background: #f8f9fa;
      padding: 28px;
      border-radius: 12px;
      border: 2px solid #e5e7eb;
      line-height: 1.65;
      font-size: 16px;
      overflow-x: auto;
    }
    .today-db {
      background: linear-gradient(135deg, #fef2f2, #fee2e2);
      border: 3px solid #f87171;
    }
    .miss-box {
      background: linear-gradient(135deg, #fefce8, #fef9c3);
      border: 3px solid #eab308;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen py-8">
  <div class="max-w-4xl mx-auto px-4">
    <h1 class="text-4xl font-bold text-center text-red-600 mb-2">📅 Data Archive Viewer</h1>
    <p class="text-center text-gray-600 mb-6">Chọn ngày → Xem 2 bản ghi + 2 số cuối mã chính ngày hôm đó</p>
    
    <!-- 2 NGÀY GẦN NHẤT KHÔNG XUẤT HIỆN -->
    <div id="missSection" class="miss-box rounded-3xl p-6 mb-8 text-center shadow-lg">
      <p class="text-yellow-700 text-sm font-medium mb-1"></p>
      <p class="text-lg font-semibold text-gray-800 mb-3">
      </p>
      <div id="missContent" class="text-2xl font-bold text-gray-800">
        <span class="text-gray-500 text-lg">Đang tải & phân tích...</span>
      </div>
      <p id="missNote" class="text-xs text-gray-500 mt-3"></p>
    </div>

    <div class="flex justify-center mb-8">
      <div class="bg-white shadow-xl rounded-2xl p-6 flex flex-col items-center w-full max-w-md">
        <label class="block text-sm font-medium text-gray-700 mb-2">Chọn ngày (dd/mm/yyyy)</label>
        <input type="date" id="selectedDate"
               class="text-3xl font-semibold text-center border-2 border-gray-300 rounded-xl px-6 py-3 focus:outline-none focus:border-red-500 w-full">
        <button onclick="loadResults()"
                class="mt-6 px-10 py-4 bg-red-600 hover:bg-red-700 text-white font-semibold text-xl rounded-2xl transition w-full">
          Xem dữ liệu
        </button>
      </div>
    </div>

    <div id="results" class="hidden">
      <div id="todayDB" class="today-db rounded-3xl p-8 text-center mb-8 hidden">
        <p class="text-red-600 text-sm font-medium mb-1">NGÀY ĐƯỢC CHỌN</p>
        <p id="todayDate" class="text-2xl font-bold text-gray-700"></p>
        <div class="mt-4">
          <span class="text-xl text-gray-600">2 số cuối mã chính:</span>
          <span id="twoLastDB" class="ml-3 text-6xl font-mono font-bold text-red-600 tracking-widest"></span>
        </div>
      </div>

      <div class="flex justify-between items-center mb-3">
        <h2 class="text-2xl font-bold text-blue-600">📋 Hai bản ghi gần nhất</h2>
        <button onclick="copyAll()"
                class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-medium rounded-2xl flex items-center gap-2 transition">
          📋 Copy toàn bộ
        </button>
      </div>
      <div id="combinedResult" class="result"></div>
    </div>

    <div id="error" class="hidden text-center text-red-500 font-medium mt-6"></div>
  </div>

  <script>
    const DATA_URL = "https://raw.githubusercontent.com/khiemdoan/vietnam-lottery-xsmb-analysis/main/data/xsmb.json";
    const STORAGE_KEY = "xsmb_miss_days_v2";
    let dataset = null;
    let dateMap = new Map();

    async function loadDataset() {
      if (dataset) return;
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error("Không tải được dữ liệu");
      dataset = await res.json();
      dateMap.clear();
      dataset.forEach(row => {
        const dateOnly = row.date.split('T')[0];
        dateMap.set(dateOnly, row);
      });
    }

    function pad(num, len) {
      return String(num).padStart(len, '0');
    }

    function formatResult(row) {
      if (!row) return "Không có dữ liệu cho ngày này";
      return `ĐB ${pad(row.special, 5)}
G.1 ${pad(row.prize1, 5)}
G.2 ${pad(row.prize2_1, 5)} ${pad(row.prize2_2, 5)}
G.3 ${pad(row.prize3_1, 5)} ${pad(row.prize3_2, 5)} ${pad(row.prize3_3, 5)} ${pad(row.prize3_4, 5)} ${pad(row.prize3_5, 5)} ${pad(row.prize3_6, 5)}
G.4 ${pad(row.prize4_1, 4)} ${pad(row.prize4_2, 4)} ${pad(row.prize4_3, 4)} ${pad(row.prize4_4, 4)}
G.5 ${pad(row.prize5_1, 4)} ${pad(row.prize5_2, 4)} ${pad(row.prize5_3, 4)} ${pad(row.prize5_4, 4)} ${pad(row.prize5_5, 4)} ${pad(row.prize5_6, 4)}
G.6 ${pad(row.prize6_1, 3)} ${pad(row.prize6_2, 3)} ${pad(row.prize6_3, 3)}
G.7 ${pad(row.prize7_1, 2)} ${pad(row.prize7_2, 2)} ${pad(row.prize7_3, 2)} ${pad(row.prize7_4, 2)}`;
    }

    function formatVNDate(isoDate) {
      const [y, m, d] = isoDate.split('-');
      return `${d}/${m}/${y}`;
    }

    // ===== SỬA LỖI TIMEZONE =====
    function addDays(isoDate, days) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d));
      dt.setUTCDate(dt.getUTCDate() + days);
      return dt.toISOString().split('T')[0];
    }

    function getAllLast2(row) {
      if (!row) return new Set();
      const fields = [
        'special', 'prize1',
        'prize2_1', 'prize2_2',
        'prize3_1', 'prize3_2', 'prize3_3', 'prize3_4', 'prize3_5', 'prize3_6',
        'prize4_1', 'prize4_2', 'prize4_3', 'prize4_4',
        'prize5_1', 'prize5_2', 'prize5_3', 'prize5_4', 'prize5_5', 'prize5_6',
        'prize6_1', 'prize6_2', 'prize6_3',
        'prize7_1', 'prize7_2', 'prize7_3', 'prize7_4'
      ];
      const s = new Set();
      fields.forEach(f => {
        if (row[f] != null) s.add(Number(row[f]) % 100);
      });
      return s;
    }

    function findTwoRecentMissDays() {
      const allDates = Array.from(dateMap.keys()).sort().reverse();
      const misses = [];

      for (const dateStr of allDates) {
        const row = dateMap.get(dateStr);
        if (!row) continue;

        const dayAgoStr = addDays(dateStr, -1);
        const weekAgoStr = addDays(dateStr, -7);
        const dayRow = dateMap.get(dayAgoStr);
        const weekRow = dateMap.get(weekAgoStr);

        if (!dayRow || !weekRow) continue;

        const last2 = Number(row.special) % 100;
        const allPrev = new Set([...getAllLast2(dayRow), ...getAllLast2(weekRow)]);

        // === ĐIỀU KIỆN MỚI ===
        // Nếu đã có ≥ 45 số thì bỏ qua ngày này (coi như không phải miss)
        if (allPrev.size >= 45) continue;

        // Chỉ tính là miss khi số ĐB không nằm trong các số đã về
        if (!allPrev.has(last2)) {
          misses.push({
            date: dateStr,
            last2: pad(last2, 2),
            special: row.special
          });
          if (misses.length >= 2) break;
        }
      }
      return misses;
    }

    function renderMissDays(misses, lastDataDate, fromCache = false) {
      const el = document.getElementById('missContent');
      const note = document.getElementById('missNote');

      if (!misses || misses.length === 0) {
        el.innerHTML = `<span class="text-gray-500">Không tìm thấy ngày nào thỏa điều kiện</span>`;
        note.textContent = '';
        return;
      }

      const html = misses.map(m => {
        return `<div class="inline-block mx-4 my-1">
          <span class="text-3xl font-mono text-red-600">${m.last2}</span>
          <span class="text-lg text-gray-700 ml-2">${formatVNDate(m.date)}</span>
        </div>`;
      }).join('<span class="text-2xl text-gray-400 mx-2">•</span>');

      el.innerHTML = html;
      note.textContent = fromCache
        ? `📦 Lấy từ bộ nhớ tạm (dữ liệu đến ${formatVNDate(lastDataDate)})`
        : `✅ Cập nhật realtime • Dữ liệu mới nhất: ${formatVNDate(lastDataDate)}`;
    }

    async function computeAndShowMissDays() {
      try {
        await loadDataset();
        const misses = findTwoRecentMissDays();
        const allDates = Array.from(dateMap.keys()).sort();
        const lastDataDate = allDates[allDates.length - 1] || '';

        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          misses,
          lastDataDate,
          savedAt: new Date().toISOString()
        }));

        renderMissDays(misses, lastDataDate, false);
      } catch (err) {
        console.error(err);
        const cached = localStorage.getItem(STORAGE_KEY);
        if (cached) {
          try {
            const obj = JSON.parse(cached);
            renderMissDays(obj.misses, obj.lastDataDate, true);
            return;
          } catch (e) {}
        }
        document.getElementById('missContent').innerHTML =
          `<span class="text-red-500">Lỗi tải dữ liệu. Vui lòng thử lại sau.</span>`;
      }
    }

    async function loadResults() {
      const input = document.getElementById('selectedDate').value;
      if (!input) {
        alert("Vui lòng chọn ngày!");
        return;
      }

      await loadDataset();

      const weekAgoStr = addDays(input, -7);
      const dayAgoStr = addDays(input, -1);
      const todayStr = input;

      const weekRow = dateMap.get(weekAgoStr);
      const dayRow = dateMap.get(dayAgoStr);
      const todayRow = dateMap.get(todayStr);

      const resultsDiv = document.getElementById('results');
      const combinedDiv = document.getElementById('combinedResult');
      const todayDiv = document.getElementById('todayDB');
      const errorDiv = document.getElementById('error');

      errorDiv.classList.add('hidden');
      resultsDiv.classList.remove('hidden');
      todayDiv.classList.add('hidden');

      if (todayRow) {
        const twoLast = pad(todayRow.special % 100, 2);
        document.getElementById('todayDate').textContent = formatVNDate(todayStr);
        document.getElementById('twoLastDB').textContent = twoLast;
        todayDiv.classList.remove('hidden');
      }

      let fullText = "phân tích tương tự cho 2 kỳ này:\n\n"
             + formatResult(weekRow)
             + '\n\n'
             + formatResult(dayRow);

      combinedDiv.textContent = fullText;

      if (!weekRow && !dayRow) {
        errorDiv.innerHTML = `Không tìm thấy dữ liệu cho hai ngày cần xem.<br>
        <span class="text-sm">Dataset cập nhật đến ngày gần nhất.</span>`;
        errorDiv.classList.remove('hidden');
      }
    }

    function copyAll() {
      const text = document.getElementById('combinedResult').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.currentTarget;
        const original = btn.innerHTML;
        btn.innerHTML = '✅ Đã copy!';
        setTimeout(() => btn.innerHTML = original, 2000);
      }).catch(() => alert('Copy thủ công: bôi đen ô bên dưới rồi Ctrl+C'));
    }

    window.onload = () => {
      // Hiện cache cũ trước (nếu có)
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        try {
          const obj = JSON.parse(cached);
          renderMissDays(obj.misses, obj.lastDataDate, true);
        } catch (e) {}
      }

      const today = new Date().toISOString().split('T')[0];
      document.getElementById('selectedDate').value = today;

      computeAndShowMissDays();
    };
  </script>
</body>
</html>
